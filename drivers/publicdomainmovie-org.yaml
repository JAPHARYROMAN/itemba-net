# PublicDomainMovie.org's observed search form, submitted with GET. A movie
# page is listed only when its slug carries a release year; it must embed
# one matching Archive feature before it can be resolved to media.
# Contract checked 2026-10-18.
name: publicdomainmovie-org
provider: PublicDomainMovie.org
hosts: [publicdomainmovie.org, www.publicdomainmovie.org]
rate:
  per_minute: 20
  concurrency: 2
search:
  url: https://publicdomainmovie.org/
  params:
    s: "{query}"
  status_name: PublicDomainMovie.org feature catalog
  timeout_seconds: 5
  require_relevance: exact
  keep: 6
  response: html
  items: "h2 > a, h3 > a"
  exclude: "nav, footer, aside, script, style, noscript, template, svg, [hidden], [aria-hidden='true']"
  limit: 30
  fields:
    title: { select: "." }
    url: { select: ".", attr: href, match: '^https://(www\.)?publicdomainmovie\.org/(?:[A-Za-z0-9_.]+-)*(?:18|19|20)[0-9]{2}(?:-[A-Za-z0-9_.]+)*/$' }
    description: { default: "A public feature-film catalog listing. Runtime, access and short playback observations are shown separately." }
  constants:
    source_type: Feature film catalog
    access_type: unknown
