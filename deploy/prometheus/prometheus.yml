# Scrapes the ITEMBA NET binary running on the host. Inside the compose
# network the host is host.docker.internal; change the target when the binary
# runs elsewhere.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: itemba
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          role: all
