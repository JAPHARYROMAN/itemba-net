name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      # A disposable Atlas database for the migration test. The test drops and
      # recreates the atlas schema, so it must never point at real data.
      atlas:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: itemba
          POSTGRES_USER: itemba
          POSTGRES_PASSWORD: itemba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemba -d itemba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ITEMBA_TEST_DATABASE_URL: postgres://itemba:itemba@127.0.0.1:5432/itemba?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The ordinary suite is offline. Live checks stay behind ITEMBA_LIVE_* variables, which CI never sets.
      - name: go test
        run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build
